name: Validar CRM EC10

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/test-gustavo-fault-injection.mjs
      - run: node scripts/test-gustavo-2026-09-17-regressions.mjs
      - run: node scripts/test-gustavo-provider-failure.mjs
