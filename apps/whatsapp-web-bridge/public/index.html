<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Ponte WhatsApp EC10</title><style>
body{font:16px system-ui;background:#07111d;color:#e7f5ff;margin:0;padding:40px}.card{max-width:720px;margin:auto;background:#101d2c;border:1px solid #24415e;border-radius:18px;padding:28px}h1{margin-top:0;color:#16d6b0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.box{background:#0a1624;border-radius:12px;padding:16px}.ok{color:#46e5a8}.bad{color:#ff8181}small{color:#9eb2c8}button{background:#16d6b0;border:0;border-radius:10px;padding:11px 16px;font-weight:700}</style></head><body><main class="card"><h1>Gustavo — ponte local</h1><p id="status">Verificando…</p><div class="grid"><div class="box">Recebidas<br><strong id="received">—</strong></div><div class="box">Respondidas<br><strong id="sent">—</strong></div><div class="box">Duplicidades bloqueadas<br><strong id="duplicates">—</strong></div><div class="box">Avisos pendentes<br><strong id="notifications">—</strong></div></div><p><small>Modo seguro: somente mensagens recebidas depois da ativação. Atendimento humano pausa a conversa. Agendas são confirmadas no CRM antes do aviso ao vendedor.</small></p><button onclick="load()">Atualizar</button></main><script>
async function load(){const r=await fetch('/health',{cache:'no-store'}).then(r=>r.json()).catch(()=>null);document.querySelector('#status').innerHTML=r?.ok&&r.oracle?'<span class="ok">Ativo — WhatsApp local e Gustavo conectados</span>':'<span class="bad">Atenção — Gustavo remoto indisponível</span>';for(const k of ['received','sent','duplicates'])document.querySelector('#'+k).textContent=r?.stats?.[k]??'—';document.querySelector('#notifications').textContent=r?.notificationsQueued??'—'}load();setInterval(load,5000)</script></body></html>
